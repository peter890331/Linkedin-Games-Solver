<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>LinkedIn Game Solver</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <img src="../icons/logo.png" alt="Logo">
      </div>
      <div class="header-text">
        <h1>LinkedIn Games Solver</h1>
        <p class="subtitle">Pick a game to auto-solve !</p>
      </div>
    </div>

    <div class="games">
      <button class="game-card" data-game="sudoku">
        <div class="game-icon">
          <img src="../icons/sudoku.png" alt="Sudoku">
        </div>
        <div class="game-info">
          <span class="game-name">Mini Sudoku</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="tango">
        <div class="game-icon">
          <img src="../icons/tango.png" alt="Tango">
        </div>
        <div class="game-info">
          <span class="game-name">Tango</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="queens">
        <div class="game-icon">
          <img src="../icons/queens.png" alt="Queens">
        </div>
        <div class="game-info">
          <span class="game-name">Queens</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="zip">
        <div class="game-icon">
          <img src="../icons/zip.png" alt="Zip">
        </div>
        <div class="game-info">
          <span class="game-name">Zip</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="patches">
        <div class="game-icon">
          <img src="../icons/patches.png" alt="Patches">
        </div>
        <div class="game-info">
          <span class="game-name">Patches</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>
    </div>

    <div class="actions">
      <button id="solve-all-btn" class="game-card" style="grid-column: 1 / -1; width: calc(100% - 20px); margin: 0 10px 10px 10px;">🤓☝️ Solve All Games in one tap !</button>
    </div>

    <div id="status" class="status hidden">
      <div class="status-icon" id="status-icon">&#9203;</div>
      <span id="status-text"></span>
    </div>

    <div class="footer">
      <span>From ronnielgandhe/linkedin-games-solver.</span>
    </div>

  <script src="popup.js"></script>
</body>
</html>
