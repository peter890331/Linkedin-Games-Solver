<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>LinkedIn Game Solver</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">
        <img src="../icons/logo.png" alt="Logo">
      </div>
      <div class="header-text">
        <h1><a href="https://github.com/peter890331/linkedin-games-solver" target="_blank" style="color: inherit; text-decoration: none;">LinkedIn Games Solver</a></h1>
        <div class="subtitle">Pick a game to auto-solve !</div>
      </div>
    </div>

    <div class="games">
      <button class="game-card" data-game="sudoku">
        <div class="game-icon">
          <img src="../icons/sudoku.png" alt="Sudoku">
        </div>
        <div class="game-info">
          <span class="game-name">Mini Sudoku</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="tango">
        <div class="game-icon">
          <img src="../icons/tango.png" alt="Tango">
        </div>
        <div class="game-info">
          <span class="game-name">Tango</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="queens">
        <div class="game-icon">
          <img src="../icons/queens.png" alt="Queens">
        </div>
        <div class="game-info">
          <span class="game-name">Queens</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="zip">
        <div class="game-icon">
          <img src="../icons/zip.png" alt="Zip">
        </div>
        <div class="game-info">
          <span class="game-name">Zip</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>

      <button class="game-card" data-game="patches">
        <div class="game-icon">
          <img src="../icons/patches.png" alt="Patches">
        </div>
        <div class="game-info">
          <span class="game-name">Patches</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>
    </div>

    <div class="actions" style="padding: 0 12px 8px;">
      <button id="solve-all-btn" class="game-card">
        <div class="game-icon">
          <img src="../icons/all.png" alt="All">
        </div>
        <div class="game-info">
          <span class="game-name" style="color: #dc2626;">Solve All Games in one tap !</span>
        </div>
        <div class="game-arrow">&#8250;</div>
      </button>
    </div>

    <div id="status" class="status hidden">
      <div class="status-icon" id="status-icon">&#9203;</div>
      <span id="status-text"></span>
    </div>

    <div id="debug-panel" class="hidden" style="margin: 0 12px 4px; padding: 4px 8px; background: #fff; border: 1px solid #e0dfdc; border-radius: 8px; font-size: 11px; color: #666; max-height: 65px; overflow-y: auto;">
      <div id="debug-log"></div>
    </div>

    <div class="footer">
      <button id="debug-btn">Debug: OFF</button>
      <span id="countdown">Next games in: --:--:--</span>
    </div>

  <script src="popup.js"></script>
</body>
</html>
